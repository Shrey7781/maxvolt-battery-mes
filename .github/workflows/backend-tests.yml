name: Backend Tests

# Runs only on push to main — not on other branches, not on pull requests.
# This is a post-merge check, not a pre-merge gate.
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Ephemeral Postgres for this job only — created fresh, destroyed at
    # the end of the run. Tests run entirely against this throwaway
    # database; nothing in this workflow talks to real AWS infra or the
    # deployed UAT/production backend.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mes_test
          POSTGRES_USER: mes
          POSTGRES_PASSWORD: mes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mes -d mes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Points at the ephemeral service container above, not any real
      # database. DB_SECRET_ARN is explicitly empty so app/config.py never
      # attempts to fetch the real production AWS Secrets Manager secret —
      # see the comment in tests/conftest.py for why this matters.
      DATABASE_URL: postgresql+psycopg://mes:mes@localhost:5432/mes_test
      DB_SECRET_ARN: ""
      RATE_LIMIT_PER_MINUTE: "1000"
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
